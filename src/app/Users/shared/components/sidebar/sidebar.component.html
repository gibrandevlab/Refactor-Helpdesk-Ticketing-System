<div class="sidebar" [class.open]="isSidebarOpen">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="logo-icon-wrapper">
        <img src="../../../assets/logo bakrie.png" alt="Logo" class="logo-img" />
      </div>
      <span class="logo-text">Helpdesk<br>Ticketing System</span>
    </div>
    <ion-button class="sidebar-close" fill="clear" (click)="closeSidebar()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </div>

  <!-- Profil User di Sidebar -->
  <div class="sidebar-user">
    <div class="avatar-wrapper">
      <img
        [src]="'https://ui-avatars.com/api/?name=' + (user.nama || 'User') + '&background=2563eb&color=fff&size=128&bold=true'"
        alt="Avatar"
        class="sidebar-avatar"
      />
      <div class="online-status"></div>
    </div>
    <div class="sidebar-user-info">
      <h4 class="sidebar-username">{{ user.nama || 'User' }}</h4>
      <p class="sidebar-userrole">👤 User</p>
    </div>
  </div>

  <div class="sidebar-menu">
    <div class="menu-label">MAIN MENU</div>
    <div class="menu-item" [class.active]="activeMenu === 'dashboard-user'" (click)="navigateTo('users/dashboard')">
      <div class="menu-icon-wrapper"><ion-icon name="home-outline" class="menu-icon"></ion-icon></div>
      <span class="menu-text">Dashboard</span>
    </div>

    <div class="menu-label">TICKET MANAGEMENT</div>
    <div class="menu-item" [class.active]="activeMenu === 'my-ticket'" (click)="navigateTo('users/my-ticket')">
      <div class="menu-icon-wrapper"><ion-icon name="list-outline" class="menu-icon"></ion-icon></div>
      <span class="menu-text">My Ticket + New Ticket</span>
    </div>

    <div class="menu-label">ASSET</div>
    <div class="menu-item" [class.active]="activeMenu === 'input-aset'" (click)="navigateTo('users/input-aset')">
      <div class="menu-icon-wrapper"><ion-icon name="cube-outline" class="menu-icon"></ion-icon></div>
      <span class="menu-text">Asset</span>
    </div>

    <div class="menu-label">FEEDBACK</div>
    <div class="menu-item" [class.active]="activeMenu === 'laporan-feedback'" (click)="navigateTo('users/feedback')">
      <div class="menu-icon-wrapper"><ion-icon name="chatbox-ellipses-outline" class="menu-icon"></ion-icon></div>
      <span class="menu-text">Laporan Feedback</span>
    </div>

    <div class="menu-label">LAINNYA</div>
    <div class="menu-item" [class.active]="activeMenu === 'profile'" (click)="navigateTo('users/profile')">
      <div class="menu-icon-wrapper"><ion-icon name="person-circle-outline" class="menu-icon"></ion-icon></div>
      <span class="menu-text">Profil Saya</span>
    </div>
    <div class="menu-item logout-item" (click)="logout()">
      <div class="menu-icon-wrapper"><ion-icon name="log-out-outline" class="menu-icon"></ion-icon></div>
      <span class="menu-text">Keluar</span>
    </div>
  </div>
</div>

<!-- OVERLAY (mobile) -->
<div class="sidebar-overlay" [class.open]="isSidebarOpen" (click)="closeSidebar()"></div>
